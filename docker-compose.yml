services:
  # 1. Dịch vụ chạy một lần tạo chứng chỉ SSL/TLS tự ký vào volume dùng chung
  cert-gen:
    image: alpine:3.20
    container_name: diemdanh_cert_gen
    restart: "no"
    command:
      - sh
      - -c
      - |
        if [ ! -f /certs/selfsigned.crt ]; then
          echo 'Đang sinh chứng chỉ TLS tự ký...'
          apk add --no-cache openssl >/dev/null 2>&1
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /certs/selfsigned.key -out /certs/selfsigned.crt -subj "/CN=localhost/O=AttendanceSystem/C=VN"
          chmod 644 /certs/selfsigned.crt /certs/selfsigned.key
          echo 'Sinh chứng chỉ TLS thành công.'
        else
          echo 'Chứng chỉ TLS đã tồn tại, tiếp tục khởi động.'
        fi
    volumes:
      - certs_data:/certs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

  # 2. Cơ sở dữ liệu MySQL 8.4 LTS
  mysql:
    image: mysql:8.4
    container_name: diemdanh_mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quan_ly_diem_danh}
      MYSQL_USER: ${MYSQL_USER:-diemdanh_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD}
      MYSQL_ROOT_HOST: 127.0.0.1
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mysql_data:/var/lib/mysql
      - ./app/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./app/db/02_permissions.sql:/docker-entrypoint-initdb.d/02_permissions.sql:ro
      - ./app/db/03_exporter.sh:/docker-entrypoint-initdb.d/03_exporter.sh:ro
    networks:
      - backend
    # Bảo mật tuyệt đối: Không mở cổng ra máy host
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  # 3. Ứng dụng Node.js Express + EJS (Multi-stage, Non-root)
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: diemdanh_app
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      PORT: 3000
      NODE_ENV: production
      TZ: Asia/Ho_Chi_Minh
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quan_ly_diem_danh}
      MYSQL_USER: ${MYSQL_USER:-diemdanh_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:-diemdanh_session_secret_2026_xyz}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-AdminPass_2026!}
      SEED_STAFF_PASSWORD: ${SEED_STAFF_PASSWORD:-StaffPass_2026!}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/healthz', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # 4. Nginx Reverse Proxy (Non-root, HTTPS, Security Headers, Rate Limit)
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: diemdanh_nginx
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=16m
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_PORT_SSL:-443}:443"
    volumes:
      - certs_data:/etc/nginx/certs:ro
    depends_on:
      cert-gen:
        condition: service_completed_successfully
      app:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://127.0.0.1:443/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Bổ sung NET_BIND_SERVICE để user non-root (nginx) có quyền mở cổng 80 và 443
    cap_add:
      - NET_BIND_SERVICE

  # 5. phpMyAdmin (Quản trị CSDL cục bộ)
  phpmyadmin:
    image: phpmyadmin:5.2.3
    container_name: diemdanh_phpmyadmin
    restart: unless-stopped
    ports:
      # Chỉ cho phép truy cập cục bộ từ máy host (127.0.0.1:8081)
      - "127.0.0.1:${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 16M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend
      - pma_bridge
    security_opt:
      - no-new-privileges:true

  # 6. Exporter thu thập metrics MySQL (Quyền tối thiểu)
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.20.0
    container_name: diemdanh_mysqld_exporter
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo '[client]' > /tmp/.my.cnf
        echo 'user=diemdanh_exporter' >> /tmp/.my.cnf
        echo "password=$$MYSQL_EXPORTER_PASSWORD" >> /tmp/.my.cnf
        echo 'host=mysql' >> /tmp/.my.cnf
        echo 'port=3306' >> /tmp/.my.cnf
        exec /bin/mysqld_exporter --config.my-cnf=/tmp/.my.cnf --collect.global_status --collect.global_variables --collect.info_schema.innodb_metrics --collect.info_schema.tables
    environment:
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend
      - monitoring
    healthcheck:
      test: ["CMD", "/bin/wget", "-q", "--spider", "http://127.0.0.1:9104/metrics"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # 7. Exporter thu thập stub_status từ Nginx
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.1
    container_name: diemdanh_nginx_exporter
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8082/stub_status
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - frontend
      - monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # 8. cAdvisor thu thập tài nguyên container (CPU, RAM, Network)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: diemdanh_cadvisor
    restart: unless-stopped
    command:
      - --port=8080
      - --docker_only=true
      - --disable_root_cgroup_stats=false
      - --housekeeping_interval=10s
      - --max_housekeeping_interval=15s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  # 9. Prometheus thu thập và lưu trữ metrics (Retention 7 ngày, Non-root)
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: diemdanh_prometheus
    restart: unless-stopped
    user: "nobody"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    ports:
      # Chỉ publish cổng ra 127.0.0.1 trên máy host
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      app:
        condition: service_healthy
      nginx-exporter:
        condition: service_started
      mysqld-exporter:
        condition: service_healthy
      cadvisor:
        condition: service_healthy
    networks:
      - monitoring
      - frontend
    healthcheck:
      test: ["CMD", "/bin/wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # 10. Grafana hiển thị trực quan hóa Dashboard (Provisioning tự động, Non-root)
  grafana:
    image: grafana/grafana:13.2.1
    container_name: diemdanh_grafana
    restart: unless-stopped
    user: "472"
    ports:
      # Chỉ publish cổng ra 127.0.0.1 trên máy host
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  monitoring:
    driver: bridge
  # Mạng bridge phụ cho phpMyAdmin: Docker không cho publish cổng từ network internal: true,
  # nên pma_bridge cho phép bind 127.0.0.1:8081 trong khi vẫn giao tiếp CSDL qua backend.
  pma_bridge:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  certs_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
